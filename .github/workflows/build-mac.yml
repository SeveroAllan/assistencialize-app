name: Build macOS Installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.0.7). A GitHub Release will be created with this tag.'
        required: true
        default: 'v1.0.6'

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Create and push git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f ${{ github.event.inputs.version }}
          git push origin ${{ github.event.inputs.version }} --force

      - name: Build macOS DMG and publish to GitHub Release
        run: npm run build -- --mac --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload DMG as artifact (fallback)
        uses: actions/upload-artifact@v4
        with:
          name: Assistencialize-macOS
          path: dist/*.dmg
          if-no-files-found: warn

